<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Delete the Universe</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #scale-indicator {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        pointer-events: none;
        user-select: none;
      }

      #scale-indicator .scale-bar {
        width: 100px;
        height: 4px;
        background: white;
        margin-bottom: 8px;
      }

      #scale-indicator .scale-value {
        font-size: 18px;
        font-weight: bold;
      }

      #scale-indicator .layer-name {
        margin-top: 4px;
        opacity: 0.8;
      }

      #scale-indicator .layer-progress {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.3);
      }

      #scale-indicator .layer-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 12px;
      }

      #scale-indicator .layer-dot {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      #scale-indicator .layer-info {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="scale-indicator">
        <div class="scale-bar"></div>
        <div class="scale-value">1.0 m</div>
        <div class="layer-name">Human</div>
        <div class="layer-progress"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
